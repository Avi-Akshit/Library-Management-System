services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build: ./lms-backend
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/lms}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      WEB_ORIGIN: http://localhost:3000
      # Email delivery stays disabled in Docker until it is configured for deployment.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
    ports:
      - "4000:4000"

  web:
    build:
      context: ./lms-web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"

volumes:
  mongo-data:
